[project]
name = "fraudtrail"
version = "0.1.0"
description = "Agentic fraud investigation and next-best action on TigerGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
    "pyTigerGraph>=1.8",
    "fastembed>=0.8.1",
    "tigergraph-mcp>=1.0.3",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudtrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "pyTigerGraph.*"
ignore_missing_imports = true
